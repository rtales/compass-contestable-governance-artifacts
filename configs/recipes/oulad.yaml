recipe_id: oulad_run_v1
seed: 42

dataset:
  id: oulad_v1
  local_path: data/oulad_v1/processed
  # snapshot must be installed via: compass fetch oulad_v1

model:
  type: sklearn_logreg
  params:
    max_iter: 1000
    C: 1.0

policy:
  topk:
    k: 500
  abstain:
    enabled: true
    gamma_entropy: 0.60
  ecl:
    enabled: true
    constraints:
      max_delta_eopp_at_k: 0.05
      min_coverage: 0.50
  mas:
    enabled: true
    tie_breakers: ["min_abs_delta_eopp", "max_utility", "min_abstain_rate"]

outputs:
  root: outputs
  decision_brief: true
  bundle_zip: true
  decision_packets: true
